name: AI Code Review

on:
  pull_request:
    branches: [dev, main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "Diff saved"

      - name: Claude AI Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            You are reviewing a pull request for FinLedger, a NestJS + Next.js fintech project built as a portfolio piece for a job application at a fintech company (nsave).

            Review the diff below and focus on:
            1. Correctness — any bugs or logic errors?
            2. Security — any exposed secrets, missing auth, injection risks?
            3. NestJS/Next.js patterns — are framework patterns used correctly?
            4. TypeScript — any type safety gaps?
            5. Fintech-specific concerns — money handling, transactions, error states?

            Be specific. For each issue: say what file and line, what the problem is, and why it matters.
            If something is done well, say so briefly.
            Keep the review focused — don't comment on style unless it causes bugs.